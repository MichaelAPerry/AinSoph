name: CI

on:
  push:
  pull_request:

jobs:
  build-and-selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Godot 4.4.1 .NET
        run: tools/ci-setup.sh

      - name: Build C#
        run: dotnet build -v q

      - name: Import project
        run: timeout 600 "$GODOT" --headless --editor --quit --path . || true

      - name: Self-test (scripted voices, throwaway world)
        run: |
          timeout 300 "$GODOT" --headless --path . -- --selftest 2>&1 | tee selftest.log
          grep -q "SELFTEST: .* 0 failed" selftest.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-log
          path: selftest.log
